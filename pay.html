<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Payment Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- navbar -->
    <div class="topnav" id="myTopnav">

        <a href="index.html">Home</a>

        <div class="shop-title">
            TheBookShop
        </div>

        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>

        <!-- mobile nav -->
        <a href="javascript:void(0);"
            class="icon"
            onclick="nav()">

            <i class="fa fa-bars"></i>

        </a>

    </div>


    <main class="container payment-container">

        <h1>Payment Details</h1>


        <!-- order summary -->
        <div class="order-summary" id="orderSummary">

            <h3>Order Summary</h3>

            <div id="orderItems"></div>

            <div
                id="orderTotal"
                class="order-total">

            </div>

        </div>


        <!-- payment form -->
        <form id="paymentForm" class="payment-form">

            <div class="form-group">

                <label for="cardNumber">
                    Mastercard Number
                </label>

                <input
                    type="text"
                    id="cardNumber"
                    placeholder="5123 4567 8912 3456"
                    maxlength="19">

                <span
                    class="error-message"
                    id="cardError">

                </span>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="expiryMonth">
                        Expiry Month
                    </label>

                    <input
                        type="number"
                        id="expiryMonth"
                        placeholder="MM"
                        min="1"
                        max="12">

                    <span
                        class="error-message"
                        id="monthError">

                    </span>

                </div>


                <div class="form-group">

                    <label for="expiryYear">
                        Expiry Year
                    </label>

                    <input
                        type="number"
                        id="expiryYear"
                        placeholder="YYYY"
                        min="2025"
                        max="2040">

                    <span
                        class="error-message"
                        id="yearError">

                    </span>

                </div>


                <div class="form-group">

                    <label for="cvv">
                        CVV / Security Code
                    </label>

                    <input
                        type="text"
                        id="cvv"
                        placeholder="123"
                        maxlength="4">

                    <span
                        class="error-message"
                        id="cvvError">

                    </span>

                </div>

            </div>


            <button
                type="submit"
                class="btn-submit">

                Continue

            </button>

        </form>


        <div
            id="paymentStatus"
            class="payment-status">

        </div>


        <!-- loading message -->
        <div
            id="loadingSpinner"
            class="loading-spinner"
            style="display: none;">

            Processing...

        </div>

    </main>


    <footer>

        <p>
            2026 TheBookShop — Secure Payment Gateway
        </p>

    </footer>


    <script src="js/main.js"></script>

</body>
</html>
